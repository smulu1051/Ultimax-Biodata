<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            color: #475569;
        }
        .access-input {
            background-color: #2b2b2b !important;
            color: #ffffff !important;
            border: 1px solid #dc143c;
            border-radius: 0px;
            padding: 2px 6px;
            font-size: 11px;
            font-family: 'Consolas', 'Courier New', monospace;
            height: 22px;
            width: 100%;
        }
        .access-input:focus {
            outline: 1px solid #38bdf8;
            background-color: #0a0a0a !important;
        }
        .access-label {
            color: #38bdf8;
            font-weight: 600;
            font-size: 11px;
            text-align: right;
            padding-right: 6px;
            white-space: nowrap;
        }
        .section-header {
            color: #38bdf8;
            font-weight: 700;
            font-size: 12px;
            text-align: center;
            margin-bottom: 4px;
        }
        .access-btn {
            background: linear-gradient(to bottom, #fde047 0%, #eab308 100%);
            color: #000000;
            border: 1px solid #a16207;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 10px;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 1px 2px rgba(0,0,0,0.3);
            border-radius: 2px;
        }
        .access-btn:hover {
            background: linear-gradient(to bottom, #fef08a 0%, #facc15 100%);
        }
        .red-border-panel {
            border: 1px solid #dc2626;
            background-color: #333333;
            padding: 6px;
            margin-bottom: 6px;
        }
        .header-bg {
            background: radial-gradient(ellipse at center, #334155 0%, #0f172a 70%, #000000 100%);
            border-bottom: 2px solid #ef4444;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Ribbon -->
    <div class="bg-amber-100/90 border-b border-amber-300 p-1.5 flex items-center justify-between text-xs">
        <div class="font-bold text-slate-800">
            <i class="fas fa-edit text-red-600 mr-1"></i> New Entry Mode
        </div>
        <div>
            <button onclick="submitEntry()" class="access-btn">
                <i class="fas fa-paper-plane mr-1"></i> Submit Record
            </button>
        </div>
    </div>

    <!-- Header Banner -->
    <div class="header-bg px-4 py-2 flex items-center justify-between border-b border-red-600">
        <div class="mx-auto bg-slate-900/90 border border-slate-600 text-white font-bold text-lg px-8 py-1 rounded shadow-lg uppercase">
            Ultimax Employee Registration
        </div>
    </div>

    <!-- Main Form -->
    <form id="employee-form" onsubmit="event.preventDefault(); submitEntry();" class="flex-grow p-2 space-y-2 max-w-[1600px] mx-auto w-full">
        <div class="red-border-panel">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-2">
                
                <!-- Personal Details Column -->
                <div class="lg:col-span-5 space-y-2">
                    <div class="red-border-panel">
                        <div class="section-header">Personal Details</div>
                        <div class="space-y-1">
                            <div class="grid grid-cols-12 items-center"><label class="col-span-5 access-label">Last Name:</label><input type="text" id="lastName" class="col-span-7 access-input" required></div>
                            <div class="grid grid-cols-12 items-center"><label class="col-span-5 access-label">First Name:</label><input type="text" id="firstName" class="col-span-7 access-input" required></div>
                            <div class="grid grid-cols-12 items-center">
                                <label class="col-span-5 access-label">SEX:</label>
                                <select id="sex" class="col-span-7 access-input">
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                </select>
                            </div>
                            <div class="grid grid-cols-12 items-center"><label class="col-span-5 access-label">Date Of Birth:</label><input type="date" id="dob" class="col-span-7 access-input"></div>
                            <div class="grid grid-cols-12 items-center"><label class="col-span-5 access-label">Mobile Phone:</label><input type="text" id="mobilePhone" class="col-span-7 access-input"></div>
                            <div class="grid grid-cols-12 items-center"><label class="col-span-5 access-label">Email Address:</label><input type="email" id="email" class="col-span-7 access-input"></div>
                        </div>
                    </div>
                </div>

                <!-- Employment Details Column -->
                <div class="lg:col-span-4 space-y-2">
                    <div class="red-border-panel">
                        <div class="section-header">Employment Info</div>
                        <div class="space-y-1">
                            <div class="grid grid-cols-12 items-center"><label class="col-span-5 access-label">Employee ID:</label><input type="text" id="employeeId" class="col-span-7 access-input font-bold" required></div>
                            <div class="grid grid-cols-12 items-center"><label class="col-span-5 access-label">Department:</label><input type="text" id="department" class="col-span-7 access-input"></div>
                            <div class="grid grid-cols-12 items-center"><label class="col-span-5 access-label">Job Title:</label><input type="text" id="jobTitle" class="col-span-7 access-input"></div>
                            <div class="grid grid-cols-12 items-center"><label class="col-span-5 access-label">Work Location:</label><input type="text" id="workLocation" class="col-span-7 access-input"></div>
                        </div>
                    </div>
                </div>

                <!-- Emergency Contact Column -->
                <div class="lg:col-span-3 space-y-2">
                    <div class="red-border-panel">
                        <div class="section-header">Emergency Contact</div>
                        <div class="space-y-1">
                            <div class="grid grid-cols-12 items-center"><label class="col-span-5 access-label">Full Name:</label><input type="text" id="emergFullName" class="col-span-7 access-input"></div>
                            <div class="grid grid-cols-12 items-center"><label class="col-span-5 access-label">Phone No:</label><input type="text" id="emergPhone" class="col-span-7 access-input"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
        
        <div class="flex justify-end p-2">
            <button type="submit" class="access-btn text-sm py-1 px-4">
                <i class="fas fa-plus-circle mr-1"></i> Add Entry
            </button>
        </div>
    </form>

    <script>
        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function submitEntry() {
            const form = document.getElementById('employee-form');
            const inputs = form.querySelectorAll('input, select');
            const data = {
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            inputs.forEach(input => {
                if (input.id) {
                    data[input.id] = input.value;
                }
            });

            if (!data.employeeId || !data.lastName || !data.firstName) {
                alert("Please complete all required fields (Employee ID, First Name, Last Name).");
                return;
            }

            try {
                // Add entry as a NEW document so existing documents cannot be overwritten
                await db.collection("employees").add(data);
                alert("New entry submitted successfully!");
                form.reset();
            } catch (err) {
                console.error("Submission error:", err);
                alert("Failed to submit record. Please try again.");
            }
        }
    </script>
</body>
</html>
